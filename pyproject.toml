[project]
name = "raster-parser"
version = "0.1.0"
description = "Native + OCR text and vector extraction from engineering PDF drawings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf",
    "numpy>=1.24,<2",
    "opencv-python",
    "pillow",
    "pydantic>=2",
    "paddleocr>=2.9,<3",
    "paddlepaddle>=2.6,<3",
    "setuptools",  # paddleocr 2.x imports it at runtime; py3.12 venvs don't ship it
    "pyautotrace",
]

[dependency-groups]
test = ["pytest"]
notebook = ["matplotlib", "scikit-learn"]
report = ["matplotlib"]  # scripts/pipeline_report_benchmark.py charts
lint = ["ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raster_parser"]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs (real OCR / LibreOffice)"]

[tool.ruff]
line-length = 100
extend-exclude = ["**/_upstream/**"]
