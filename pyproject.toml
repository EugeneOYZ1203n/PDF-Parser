[project]
name = "raster-parser"
version = "0.1.0"
description = "Native + OCR text and vector extraction from engineering PDF drawings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf",
    "numpy>=1.24,<2",
    "opencv-python",
    "pillow",
    "pydantic>=2",
    "paddleocr>=2.9,<3",
    "paddlepaddle>=2.6,<3",
    "setuptools",  # paddleocr 2.x imports it at runtime; py3.12 venvs don't ship it
    "pyautotrace",
    "scipy",  # v2_vector_class: cKDTree in the pattern-lattice step
    "scikit-image",  # commons.raster_text + junction: deskew, skeletons (already pulled in by paddleocr)
    "pyenchant",  # v2_vector_class: English-word scoring; Linux also needs libenchant-2-2 + hunspell-en-us
    "tqdm",  # stage progress bars (commons/progress.py)
]

[project.optional-dependencies]
# involution_stroke (and later raster backends): torch (CPU wheels:
# https://download.pytorch.org/whl/cpu), plus what the vendored upstream code imports.
ml = ["torch", "networkx", "shapely", "matplotlib"]

[dependency-groups]
test = ["pytest"]
notebook = ["matplotlib", "scikit-learn"]
report = ["matplotlib"]  # scripts/pipeline_report_benchmark.py charts
lint = ["ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raster_parser"]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs (real OCR / LibreOffice)"]

[tool.ruff]
line-length = 100
extend-exclude = ["**/_upstream/**"]
